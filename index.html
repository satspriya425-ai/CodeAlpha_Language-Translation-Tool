<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Language Translation Tool</h1>

        <!-- Input Text -->
        <textarea 
            id="inputText"
            placeholder="Enter text to translate..."
            rows="8"
            maxlength="5000"></textarea>

        <div class="input-info">
            <span id="statusMessage">Ready to translate</span>
            <span id="detectedLanguage"></span>
            <span id="characterCount">0 / 5000</span>
        </div>

        <!-- Language Selection -->
        <div class="language-section">

        <div class="language-box">
            <label for="sourceLanguage">From</label>

            <select id="sourceLanguage">
                <option value="auto">Auto Detect</option>
                <option value="en">English</option>
                <option value="fr">French</option>
            </select>
        </div>

    <button id="swapButton" class="swap-button" title="Swap languages">
        ⇄
    </button>

    <div class="language-box">
        <label for="targetLanguage">To</label>

        <select id="targetLanguage">
            <option value="en">English</option>
            <option value="fr">French</option>
        </select>
    </div>

</div>

        
        <!-- Translate Button -->
        <button id="translateButton" class="translate-button">Translate</button>

        <!-- Translation Output -->
        <h2>Translated Text</h2>

        <textarea 
            id="translatedText"
            placeholder="Translation will appear here..."
            rows="8"
            readonly>
        </textarea>

        <!-- Extra Buttons -->
        <div class="button-group">

            <button id="clearButton" class="secondary-button">
                🗑️ Clear
            </button>

            <button id="copyButton" class="secondary-button">
                📋 Copy Translation
            </button>

            <button id="speakButton" class="secondary-button">
                🔊 Speak Translation
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
